<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Entry</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
  <main class="form-container">
    <h2>Edit Entry</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="button-group">
        <button type="submit" class="btn">Save Changes</button>
        <a href="{% url 'full_details' entry.id %}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </main>
</body>
</html>
