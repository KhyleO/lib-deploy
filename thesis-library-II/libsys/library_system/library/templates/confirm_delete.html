<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Confirm Deletion</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
  <main class="details-container">
    <h2>Confirm Deletion</h2>
    <p>Are you sure you want to delete <strong>{{ entry.title }}</strong>?</p>

    <form method="post">
      {% csrf_token %}
      <div class="button-group">
        <button type="submit" class="btn btn-secondary">Yes, Delete</button>
        <a href="{% url 'full_details' entry.id %}" class="btn">Cancel</a>
      </div>
    </form>
  </main>
</body>
</html>
